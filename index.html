<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b16">
<title>霓虹贪吃蛇</title>
<style>
  :root {
    --bg: #080b16;
    --panel: #101628;
    --line: #1e2a45;
    --mint: #7cffb2;
    --pink: #ff6b9e;
    --ink: #eaf2ff;
    --muted: #8494b5;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    min-height: 100svh;
    padding: 24px 16px;
    color: var(--ink);
    font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
    background:
      radial-gradient(circle at 20% 0%, #173257 0, transparent 34rem),
      radial-gradient(circle at 100% 100%, #321a3c 0, transparent 32rem),
      var(--bg);
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .25;
    background: repeating-linear-gradient(0deg, transparent 0 3px, #000 3px 4px);
  }
  .shell {
    position: relative;
    width: min(100%, 500px);
  }
  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 14px;
  }
  .eyebrow {
    margin: 0 0 5px;
    color: var(--mint);
    font-size: .65rem;
    letter-spacing: .28em;
  }
  h1 {
    margin: 0;
    font-size: clamp(1.45rem, 6vw, 2rem);
    letter-spacing: -.04em;
  }
  .scores {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .chip {
    min-width: 62px;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(16, 22, 40, .78);
    text-align: right;
  }
  .chip span {
    display: block;
    color: var(--muted);
    font-size: .55rem;
    letter-spacing: .12em;
  }
  .chip b {
    display: block;
    margin-top: 2px;
    font-size: 1.05rem;
    font-variant-numeric: tabular-nums;
  }
  .board {
    position: relative;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 18px;
    background: var(--panel);
    box-shadow: 0 24px 70px rgba(0, 0, 0, .45), 0 0 0 1px rgba(124, 255, 178, .04) inset;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 1;
    touch-action: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    text-align: center;
    background: rgba(5, 8, 17, .74);
    backdrop-filter: blur(5px);
    transition: opacity .18s ease, visibility .18s ease;
  }
  .overlay.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .overlay h2 {
    margin: 0 0 8px;
    font-size: clamp(1.35rem, 7vw, 2rem);
    letter-spacing: -.04em;
  }
  .overlay p {
    max-width: 290px;
    margin: 0 auto 20px;
    color: var(--muted);
    font-size: .78rem;
    line-height: 1.7;
  }
  .primary {
    min-width: 154px;
    padding: 12px 22px;
    border: 0;
    border-radius: 999px;
    color: #05110a;
    background: var(--mint);
    box-shadow: 0 0 28px rgba(124, 255, 178, .26);
    font: 700 .82rem/1 "Cascadia Code", Consolas, monospace;
    letter-spacing: .06em;
    cursor: pointer;
  }
  .primary:hover { filter: brightness(1.08); }
  .primary:focus-visible, .dpad button:focus-visible {
    outline: 2px solid var(--pink);
    outline-offset: 3px;
  }
  .controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    margin-top: 16px;
  }
  .hint {
    margin: 0;
    color: var(--muted);
    font-size: .64rem;
    line-height: 1.8;
  }
  .hint kbd {
    padding: 1px 4px;
    border: 1px solid var(--line);
    border-radius: 4px;
    color: #b9c8e4;
    font: inherit;
  }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 34px);
    grid-template-rows: repeat(2, 34px);
    gap: 4px;
    flex-shrink: 0;
  }
  .dpad button {
    display: grid;
    place-items: center;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--muted);
    background: rgba(16, 22, 40, .8);
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
  }
  .dpad button:active { color: var(--bg); background: var(--mint); }
  .dpad button[data-dir="up"] { grid-column: 2; grid-row: 1; }
  .dpad button[data-dir="left"] { grid-column: 1; grid-row: 2; }
  .dpad button[data-dir="down"] { grid-column: 2; grid-row: 2; }
  .dpad button[data-dir="right"] { grid-column: 3; grid-row: 2; }
  footer {
    margin-top: 14px;
    color: #566583;
    font-size: .58rem;
    letter-spacing: .08em;
    text-align: center;
  }
  @media (max-width: 520px) {
    body { padding: 16px 12px; }
    .hint { display: none; }
    .controls { justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    .overlay { transition: none; }
  }
</style>
</head>
<body>
<main class="shell">
  <header>
    <div>
      <p class="eyebrow">MINI ARCADE / 01</p>
      <h1>霓虹贪吃蛇</h1>
    </div>
    <div class="scores" aria-live="polite">
      <div class="chip"><span>得分</span><b id="score">0</b></div>
      <div class="chip"><span>最高</span><b id="best">0</b></div>
    </div>
  </header>

  <div class="board">
    <canvas id="game" width="480" height="480" role="img" aria-label="贪吃蛇游戏区域"></canvas>
    <div class="overlay" id="overlay">
      <div>
        <h2 id="overlay-title">准备开始</h2>
        <p id="overlay-copy">吃掉粉色光点，别撞墙，也别咬到自己。</p>
        <button class="primary" id="action" type="button">开始游戏</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <p class="hint">
      <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> / <kbd>WASD</kbd> 移动<br>
      <kbd>空格</kbd> 暂停 · <kbd>R</kbd> 重开 · 手机可滑动屏幕
    </p>
    <div class="dpad" aria-label="方向控制">
      <button type="button" data-dir="up" aria-label="向上">▲</button>
      <button type="button" data-dir="left" aria-label="向左">◀</button>
      <button type="button" data-dir="down" aria-label="向下">▼</button>
      <button type="button" data-dir="right" aria-label="向右">▶</button>
    </div>
  </div>
  <footer>NO DEPENDENCIES · ONE FILE · JUST OPEN IT</footer>
</main>

<script>
(() => {
  "use strict";

  const canvas = document.querySelector("#game");
  const ctx = canvas.getContext("2d");
  const overlay = document.querySelector("#overlay");
  const title = document.querySelector("#overlay-title");
  const copy = document.querySelector("#overlay-copy");
  const action = document.querySelector("#action");
  const scoreEl = document.querySelector("#score");
  const bestEl = document.querySelector("#best");

  const COLS = 20;
  const ROWS = 20;
  const CELL = canvas.width / COLS;
  const TICK_START = 115;
  const TICK_MIN = 72;
  const KEY_DIRS = {
    ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
    ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
    ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
    ArrowRight: [1, 0], d: [1, 0], D: [1, 0]
  };

  let snake, dir, queue, food, score, best, state, tickMs, acc, last;
  let swipeStart = null;

  try {
    best = Number(localStorage.getItem("neon-snake-best")) || 0;
  } catch {
    best = 0;
  }
  bestEl.textContent = best;

  function reset() {
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    dir = { x: 1, y: 0 };
    queue = [];
    score = 0;
    tickMs = TICK_START;
    acc = 0;
    last = performance.now();
    scoreEl.textContent = "0";
    placeFood();
    showOverlay("准备开始", "吃掉粉色光点，别撞墙，也别咬到自己。", "开始游戏");
    state = "ready";
  }

  function showOverlay(heading, text, buttonText) {
    title.textContent = heading;
    copy.textContent = text;
    action.textContent = buttonText;
    overlay.classList.remove("hide");
  }

  function hideOverlay() {
    overlay.classList.add("hide");
  }

  function start() {
    if (state === "ready") {
      state = "playing";
      last = performance.now();
      acc = 0;
      hideOverlay();
    } else if (state === "paused") {
      state = "playing";
      last = performance.now();
      acc = 0;
      hideOverlay();
    } else {
      reset();
      state = "playing";
      hideOverlay();
    }
  }

  function pause() {
    if (state !== "playing") return;
    state = "paused";
    showOverlay("已暂停", "按空格或点击按钮继续。", "继续游戏");
  }

  function togglePause() {
    if (state === "playing") pause();
    else if (state === "paused") start();
  }

  function placeFood() {
    const open = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!snake.some(seg => seg.x === x && seg.y === y)) open.push({ x, y });
      }
    }
    if (!open.length) {
      state = "won";
      food = null;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        try { localStorage.setItem("neon-snake-best", String(best)); } catch {}
      }
      showOverlay("全部吃光！", `完美清屏，得分 ${score}。`, "再来一局");
      return;
    }
    food = open[Math.floor(Math.random() * open.length)];
  }

  function turn(x, y) {
    if (state === "ready") start();
    if (state !== "playing") return;
    const prior = queue.length ? queue[queue.length - 1] : dir;
    if ((x === prior.x && y === prior.y) || (x === -prior.x && y === -prior.y)) return;
    if (queue.length < 2) queue.push({ x, y });
  }

  function step() {
    if (queue.length) dir = queue.shift();
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    const eating = food && head.x === food.x && head.y === food.y;
    const body = eating ? snake : snake.slice(0, -1);
    const hitWall = head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS;
    const hitSelf = body.some(seg => seg.x === head.x && seg.y === head.y);

    if (hitWall || hitSelf) {
      state = "gameover";
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        try { localStorage.setItem("neon-snake-best", String(best)); } catch {}
      }
      showOverlay("游戏结束", `本局得分 ${score}，最高纪录 ${best}。`, "再来一局");
      return;
    }

    snake.unshift(head);
    if (eating) {
      score++;
      scoreEl.textContent = score;
      tickMs = Math.max(TICK_MIN, TICK_START - Math.floor(score / 5) * 7);
      placeFood();
    } else {
      snake.pop();
    }
  }

  function roundedRect(x, y, w, h, r) {
    const radius = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + w, y, x + w, y + h, radius);
    ctx.arcTo(x + w, y + h, x, y + h, radius);
    ctx.arcTo(x, y + h, x, y, radius);
    ctx.arcTo(x, y, x + w, y, radius);
    ctx.closePath();
  }

  function draw(now) {
    const W = canvas.width;
    ctx.clearRect(0, 0, W, W);

    const bg = ctx.createLinearGradient(0, 0, W, W);
    bg.addColorStop(0, "#0d1427");
    bg.addColorStop(1, "#090d19");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, W);

    ctx.strokeStyle = "rgba(124, 255, 178, .045)";
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL + .5, 0);
      ctx.lineTo(i * CELL + .5, W);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL + .5);
      ctx.lineTo(W, i * CELL + .5);
      ctx.stroke();
    }

    if (food) {
      const pulse = 1 + Math.sin(now / 220) * .08;
      const cx = food.x * CELL + CELL / 2;
      const cy = food.y * CELL + CELL / 2;
      ctx.save();
      ctx.shadowColor = "#ff6b9e";
      ctx.shadowBlur = 18;
      ctx.fillStyle = "#ff6b9e";
      ctx.beginPath();
      ctx.arc(cx, cy, CELL * .27 * pulse, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    for (let i = snake.length - 1; i >= 0; i--) {
      const seg = snake[i];
      const inset = i === 0 ? 2 : 3;
      const alpha = 1 - (i / Math.max(snake.length, 8)) * .45;
      ctx.fillStyle = i === 0 ? "#a8ffc9" : `rgba(124, 255, 178, ${alpha})`;
      ctx.shadowColor = i === 0 ? "rgba(124, 255, 178, .8)" : "transparent";
      ctx.shadowBlur = i === 0 ? 16 : 0;
      roundedRect(seg.x * CELL + inset, seg.y * CELL + inset, CELL - inset * 2, CELL - inset * 2, 7);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    const head = snake[0];
    const hx = head.x * CELL + CELL / 2;
    const hy = head.y * CELL + CELL / 2;
    const eyeOffset = dir.x ? { x: dir.x * 4, y: 4 } : { x: 4, y: dir.y * 4 };
    const eyes = dir.x
      ? [{ x: hx + eyeOffset.x, y: hy - 4 }, { x: hx + eyeOffset.x, y: hy + 4 }]
      : [{ x: hx - 4, y: hy + eyeOffset.y }, { x: hx + 4, y: hy + eyeOffset.y }];
    ctx.fillStyle = "#07130c";
    for (const eye of eyes) {
      ctx.beginPath();
      ctx.arc(eye.x, eye.y, 2.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function loop(now) {
    if (state === "playing") {
      acc += Math.min(now - last, 100);
      last = now;
      while (acc >= tickMs && state === "playing") {
        acc -= tickMs;
        step();
      }
    } else {
      last = now;
    }
    draw(now);
    requestAnimationFrame(loop);
  }

  action.addEventListener("click", start);

  document.querySelectorAll("[data-dir]").forEach(button => {
    button.addEventListener("pointerdown", event => {
      event.preventDefault();
      const dirs = {
        up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0]
      };
      const [x, y] = dirs[button.dataset.dir];
      turn(x, y);
    });
  });

  window.addEventListener("keydown", event => {
    if (event.key === " " || event.key === "Spacebar") {
      event.preventDefault();
      togglePause();
      return;
    }
    if (event.key === "r" || event.key === "R") {
      reset();
      return;
    }
    const direction = KEY_DIRS[event.key];
    if (!direction) return;
    event.preventDefault();
    turn(direction[0], direction[1]);
  });

  canvas.addEventListener("pointerdown", event => {
    if (event.pointerType === "mouse") return;
    swipeStart = { x: event.clientX, y: event.clientY };
  });

  canvas.addEventListener("pointerup", event => {
    if (event.pointerType === "mouse" || !swipeStart) return;
    const dx = event.clientX - swipeStart.x;
    const dy = event.clientY - swipeStart.y;
    swipeStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
    else turn(0, dy > 0 ? 1 : -1);
  });

  canvas.addEventListener("pointercancel", () => { swipeStart = null; });

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
